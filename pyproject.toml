[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "firewalla-mcp"
version = "0.1.0"
description = "Unofficial read-only Firewalla diagnostics over verified SSH"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "pydantic>=2.11,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
firewalla-mcp = "firewalla_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
