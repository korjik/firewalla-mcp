name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install -e '.[test]'
      - run: pytest -q
      - run: python scripts/generate_catalog.py --check
      - run: python -m compileall -q src scripts
      - run: docker build -t firewalla-mcp:test .
      - run: python tests/container_smoke.py firewalla-mcp:test
      - run: python tests/http_container_smoke.py firewalla-mcp:test
      - run: python tests/forwarding_container_smoke.py firewalla-mcp:test
      - run: python scripts/curl_smoke.py firewalla-mcp:test
      - run: docker build -f Dockerfile.legacy -t firewalla-mcp:legacy .
      - run: docker build -f tests/Dockerfile.kernel -t firewalla-mcp:kernel-test .
      - run: docker run --rm --network none --cap-drop ALL --cap-add NET_ADMIN -v "$PWD/tests:/tests:ro" firewalla-mcp:kernel-test
      - run: docker build -f tests/Dockerfile.forward -t firewalla-mcp:forward-contract-tests .
      - run: docker run --rm --network none --cap-drop ALL --cap-add NET_ADMIN --cap-add NET_RAW --entrypoint python -v "$PWD/tests:/tests:ro" firewalla-mcp:forward-contract-tests /tests/forwarding_ipv4_scope_smoke.py
      - run: docker run --rm --network none --user 1000:1000 --cap-drop ALL --entrypoint python -e PYTHONPATH=/src -v "$PWD/src:/src:ro" -v "$PWD/tests:/tests:ro" firewalla-mcp:forward-contract-tests /tests/forwarding_projection_smoke.py
